name: Apply Power NOW production source

on:
  push:
    branches:
      - build/direct-sales-site
    paths:
      - .github/workflows/apply-storefront-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: build/direct-sales-site
          fetch-depth: 0

      - name: Rehydrate reviewed storefront source
        shell: bash
        run: |
          set -euo pipefail
          cat .powernow-bootstrap/part* | base64 --decode > /tmp/powernow-source.tar.xz
          tar -xJf /tmp/powernow-source.tar.xz -C .
          rm -rf .powernow-bootstrap
          rm -f .github/workflows/apply-storefront-source.yml

      - name: Commit the reviewed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Apply production UI, Stripe checkout, and Vercel release"
          git push origin HEAD:build/direct-sales-site
