name: Apply multi-book series architecture

on:
  push:
    branches:
      - feature/multi-book-series
    paths:
      - .github/workflows/apply-multi-book-series.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-book-series
          fetch-depth: 0

      - name: Materialize production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/powernow-source
          mkdir -p /tmp/powernow-source
          cat .powernow/part* | base64 --decode > /tmp/powernow-source.tar.xz
          tar -xJf /tmp/powernow-source.tar.xz -C /tmp/powernow-source

      - name: Apply multi-book source changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            /tmp/powernow-source/app/books/'[slug]' \
            /tmp/powernow-source/app/api/admin/books \
            /tmp/powernow-source/components \
            /tmp/powernow-source/src/lib

          cp inspection-series/app/page.tsx /tmp/powernow-source/app/page.tsx
          cp inspection-series/app/layout.tsx /tmp/powernow-source/app/layout.tsx
          cp inspection-series/app/series.css /tmp/powernow-source/app/series.css
          cp inspection-series/app/sitemap.ts /tmp/powernow-source/app/sitemap.ts
          cp inspection-series/app/api/checkout/route.ts /tmp/powernow-source/app/api/checkout/route.ts
          cp inspection-series/app/api/admin/books/route.ts /tmp/powernow-source/app/api/admin/books/route.ts
          cp inspection-series/app/admin/page.tsx /tmp/powernow-source/app/admin/page.tsx
          cp inspection-series/app/books/page.tsx /tmp/powernow-source/app/books/page.tsx
          cp inspection-series/app/books/'[slug]'/page.tsx /tmp/powernow-source/app/books/'[slug]'/page.tsx

          cp inspection-series/components/SeriesBookCover.tsx /tmp/powernow-source/components/SeriesBookCover.tsx
          cp inspection-series/components/SeriesShelf.tsx /tmp/powernow-source/components/SeriesShelf.tsx
          cp inspection-series/components/SeriesCheckoutButton.tsx /tmp/powernow-source/components/SeriesCheckoutButton.tsx
          cp inspection-series/components/SeriesCatalogEditor.tsx /tmp/powernow-source/components/SeriesCatalogEditor.tsx

          cp inspection-series/src/lib/books.ts /tmp/powernow-source/src/lib/books.ts
          cp inspection-series-operational/src/lib/orders.ts /tmp/powernow-source/src/lib/orders.ts

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/powernow-source/ ./
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:pricing
          npm run typecheck
          npm run build
          test -f app/books/page.tsx
          test -f 'app/books/[slug]/page.tsx'
          test -f app/api/admin/books/route.ts

      - name: Repack production application bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -cJf /tmp/powernow-source-new.tar.xz -C /tmp/powernow-source .
          archive_hash="$(sha256sum /tmp/powernow-source-new.tar.xz | awk '{print $1}')"
          base64 -w0 /tmp/powernow-source-new.tar.xz > /tmp/powernow-source.b64
          rm -f .powernow/part*
          split -b 500000 -d -a 2 /tmp/powernow-source.b64 .powernow/part

          ARCHIVE_HASH="$archive_hash" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          archive_hash = os.environ['ARCHIVE_HASH']
          bootstrap = Path('bootstrap.mjs')
          text = bootstrap.read_text()
          text = re.sub(
              r'Materialized Power NOW storefront source(?: from verified main release)?(?: \([0-9a-f]+\))?\.',
              f'Materialized Power NOW storefront source ({archive_hash[:12]}).',
              text,
          )
          bootstrap.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(
              r'Archive SHA-256:\n\n```text\n[0-9a-f]{64}\n```',
              f'Archive SHA-256:\n\n```text\n{archive_hash}\n```',
              text,
          )
          readme.write_text(text)
          PY

      - name: Remove implementation inspection files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspection-series inspection-series-operational
          rm -f .github/workflows/extract-series-upgrade-source.yml
          rm -f .github/workflows/apply-multi-book-series.yml

      - name: Commit verified series architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade Power NOW storefront for multiple books"
          git push origin HEAD:feature/multi-book-series
