name: Apply design simplification

on:
  push:
    branches:
      - fix/design-simplification
    paths:
      - .github/workflows/apply-design-simplification.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design-simplification
          fetch-depth: 0

      - name: Materialize bundled source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/powernow-source
          mkdir -p /tmp/powernow-source
          cat .powernow/part* | base64 --decode > /tmp/powernow-source.tar.xz
          tar -xJf /tmp/powernow-source.tar.xz -C /tmp/powernow-source

      - name: Apply storefront design correction
        shell: bash
        run: |
          set -euo pipefail
          cp inspection/app/page.tsx /tmp/powernow-source/app/page.tsx
          cp inspection/app/layout.tsx /tmp/powernow-source/app/layout.tsx
          cp inspection/app/design-overrides.css /tmp/powernow-source/app/design-overrides.css

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/site-settings.json')
          settings = json.loads(path.read_text())
          settings['theme'] = {
              'useCoverPalette': False,
              'fallbackPrimary': '#171717',
              'fallbackSecondary': '#57534E',
              'fallbackAccent': '#8A6418',
              'fallbackPaper': '#FFFFFF',
          }
          settings['proof']['assuranceItems'] = [
              'Secure Stripe checkout',
              '$20.00 per book + $4.95 shipping per order',
              'Applicable tax itemized at checkout',
          ]
          path.write_text(json.dumps(settings, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/powernow-source/ ./
          npm install --ignore-scripts
          npm run check:pricing
          npm run typecheck
          npm run build

      - name: Repack application bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -cJf /tmp/powernow-source-new.tar.xz -C /tmp/powernow-source .
          archive_hash="$(sha256sum /tmp/powernow-source-new.tar.xz | awk '{print $1}')"
          base64 -w0 /tmp/powernow-source-new.tar.xz > /tmp/powernow-source.b64
          rm -f .powernow/part*
          split -b 500000 -d -a 2 /tmp/powernow-source.b64 .powernow/part

          ARCHIVE_HASH="$archive_hash" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          archive_hash = os.environ['ARCHIVE_HASH']

          bootstrap = Path('bootstrap.mjs')
          text = bootstrap.read_text()
          text = re.sub(
              r'Materialized Power NOW storefront source(?: from verified main release)?(?: \([0-9a-f]+\))?\.',
              f'Materialized Power NOW storefront source ({archive_hash[:12]}).',
              text,
          )
          bootstrap.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(
              r'Archive SHA-256:\n\n```text\n[0-9a-f]{64}\n```',
              f'Archive SHA-256:\n\n```text\n{archive_hash}\n```',
              text,
          )
          readme.write_text(text)
          PY

      - name: Remove temporary inspection tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspection
          rm -f .github/workflows/extract-source-for-design-fix.yml
          rm -f .github/workflows/apply-design-simplification.yml

      - name: Commit verified design correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify storefront design and stabilize first-paint color"
          git push origin HEAD:fix/design-simplification
