name: Extract series upgrade source

on:
  push:
    branches:
      - feature/multi-book-series
    paths:
      - .github/workflows/extract-series-upgrade-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-book-series
          fetch-depth: 0
      - name: Materialize bundled source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/powernow-source inspection-series-operational
          mkdir -p /tmp/powernow-source inspection-series-operational/app/api/stripe/webhook inspection-series-operational/src/lib inspection-series-operational/components
          cat .powernow/part* | base64 --decode > /tmp/powernow-source.tar.xz
          tar -xJf /tmp/powernow-source.tar.xz -C /tmp/powernow-source
          cp /tmp/powernow-source/app/api/stripe/webhook/route.ts inspection-series-operational/app/api/stripe/webhook/route.ts
          cp /tmp/powernow-source/app/sitemap.ts inspection-series-operational/app/sitemap.ts
          cp /tmp/powernow-source/components/OrderLedger.tsx inspection-series-operational/components/OrderLedger.tsx
          find /tmp/powernow-source/src/lib -maxdepth 1 -type f | sort > inspection-series-operational/src-lib-files.txt
          cp /tmp/powernow-source/src/lib/*.ts inspection-series-operational/src/lib/
      - name: Commit operational inspection source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection-series-operational
          git commit -m "Expose order-center source for multi-book series upgrade"
          git push origin HEAD:feature/multi-book-series
